# Mapping van (geconsolideerde) afzendernaam -> bedrijfsdomein, gebruikt om
# een logo op te halen (via icons.duckduckgo.com/ip3/<domein>.ico) voor de
# abonnementen-pagina.
#
# Exacte string-match op de `afzender`-kolom in gold.transacties (dus geen
# regex) — die is al geconsolideerd door de afzender-logica in
# src/pipeline/transacties/gold.py, dus dit hoeft maar één keer per bedrijf.
#
# Kom je een nieuw gedetecteerd abonnement tegen zonder logo? Voeg het hier
# toe met het juiste domein. Twijfel je over het domein? Laat het weg — een
# fout domein toont het verkeerde logo, geen logo toont een nette
# initialen-avatar in de frontend.

