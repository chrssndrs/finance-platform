services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: finance-platform-backend
    # cron draait met een leeg environment (leest alleen /etc/environment via
    # PAM) — zonder deze regel ziet de nachtelijke run FINANCE_DATA_ROOT/
    # FINANCE_CONFIG_ROOT niet en valt terug op een pad binnen de image i.p.v.
    # de gemounte data (faalt direct met "db/finance.duckdb: No such file").
    command: ["sh", "-c", "env > /etc/environment && touch /var/log/cron.log && cron && tail -f /var/log/cron.log"]
    environment:
      FINANCE_DATA_ROOT: /data
      FINANCE_CONFIG_ROOT: /app/config
    volumes:
      - ${FINANCE_DATA_ROOT}:/data
      - ${FINANCE_CONFIG_ROOT}:/app/config
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: finance-platform-backend
    command: ["python", "-m", "uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      FINANCE_DATA_ROOT: /data
      FINANCE_CONFIG_ROOT: /app/config
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - ${FINANCE_DATA_ROOT}:/data
      - ${FINANCE_CONFIG_ROOT}:/app/config
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
